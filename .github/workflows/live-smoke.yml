name: live-smoke

# Manual only. Never required for merges. Exercises real provider
# credentials when configured; otherwise explicitly reports that no live
# check ran. A skipped or unavailable run is not a passing live-quality
# claim (see docs/CONTRACTS.md and PLAN.md's offline/live CI split).

on:
  workflow_dispatch: {}

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for provider credentials
        id: creds
        run: |
          if [[ -z "${{ secrets.LLM_PROVIDER_API_KEY }}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report unavailable (no credentials)
        if: steps.creds.outputs.available == 'false'
        run: |
          echo "::warning::No provider credentials configured. Live smoke did not run and proves nothing about live behavior."

      - name: Report not yet implemented (credentials present)
        if: steps.creds.outputs.available == 'true'
        run: |
          echo "::warning::Provider credentials are present, but the application (G1 API, C1 inventory, G2 retrieval, C2 frontend) is not implemented yet. There is nothing to smoke-test."

      # Once GET /api/ready is implemented, replace the steps above with:
      #   docker compose -f infra/compose.yaml up -d --build
      #   ./scripts/db-health.sh
      #   curl --fail http://localhost:${API_PORT:-8100}/api/ready
      # and only then exercise one real chat/tool-call round trip.
