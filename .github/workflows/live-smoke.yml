name: live-smoke

# Manual only. Never required for merges. Exercises real provider
# credentials when configured; otherwise explicitly reports that no live
# check ran. A skipped or unavailable run is not a passing live-quality
# claim (see docs/CONTRACTS.md and PLAN.md's offline/live CI split).

on:
  workflow_dispatch: {}

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for provider credentials
        id: creds
        run: |
          if [[ -z "${{ secrets.OPENAI_API_KEY }}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report unavailable (no credentials)
        if: steps.creds.outputs.available == 'false'
        run: |
          echo "::warning::No provider credentials configured. Live smoke did not run and proves nothing about live behavior."

      # Inventory (C1) and retrieval (G2) are real and wired into G1's
      # bootstrap factory as of the merge into main; only this last step
      # (the actual OpenAI call) has not been exercised, since that
      # requires a real key this development environment doesn't have.
      - name: Migrate and seed
        if: steps.creds.outputs.available == 'true'
        run: ./scripts/migrate-and-seed.sh

      - name: Start the integrated backend
        if: steps.creds.outputs.available == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_CHAT_MODEL: ${{ secrets.OPENAI_CHAT_MODEL }}
        run: docker compose -f infra/compose.yaml up -d --build backend

      - name: Confirm the backend reports fully ready
        if: steps.creds.outputs.available == 'true'
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:${API_PORT:-8100}/api/ready && break
            sleep 1
          done
          curl -sf http://localhost:${API_PORT:-8100}/api/ready | grep -q '"status":"ready"'

      - name: Exercise one real chat round trip
        if: steps.creds.outputs.available == 'true'
        run: |
          response=$(curl -sf -X POST http://localhost:${API_PORT:-8100}/api/chat \
            -H "Content-Type: application/json" \
            -d '{"message":"How do I receive a delivery?"}')
          echo "$response"
          echo "$response" | python3 -c "import json,sys; body=json.load(sys.stdin); assert body['status'] in ('answered','needs_clarification','insufficient_evidence'), body['status']"

      - name: Tear down
        if: always() && steps.creds.outputs.available == 'true'
        run: ./scripts/teardown.sh
